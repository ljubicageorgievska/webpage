project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  pre-render:
    - python3 scripts/build_research_page.py
    - python3 scripts/build_google_sites_page.py
  # Nothing on the site links to this helper page, so Quarto would not copy
  # it across on its own. It carries a noindex tag and exists only so the
  # Google Sites page can be refreshed by copy and paste.
  resources:
    - files/google-sites.html

website:
  title: "Ljubica Georgievska"
  description: "Ljubica Georgievska, Assistant Professor of Finance at CUNEF Universidad and Visiting Assistant Professor at NYU Stern School of Business. Research in empirical asset pricing, international finance, derivatives and macro-finance."
  site-url: "https://ljubicageorgievska.github.io/webpage"
  # Emit Open Graph / Twitter card tags, so a shared link shows the title and
  # description instead of a bare URL. Search engines read these too.
  open-graph: true
  twitter-card: true
  navbar:
    background: "#1b2a41"
    foreground: light
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
    right:
      - text: CV
        href: "files/cv.pdf"
      - text: Google Scholar
        href: "https://scholar.google.com/citations?user=VOG7pkkAAAAJ&hl=en"
  page-footer:
    center: "© Ljubica Georgievska"
  # ---------------------------------------------------------------
  # GOOGLE ANALYTICS. Do not remove this line: as well as collecting
  # visitor statistics, the tracking code it inserts is what proves to
  # Google Search Console that this site belongs to you. Deleting it
  # would drop the site's verified ownership there.
  # ---------------------------------------------------------------
  google-analytics: "G-6B1M33EFRD"
  cookie-consent: true

format:
  html:
    theme:
      - litera
      - assets/styles.scss
    toc: false
    linkcolor: "#7d5a2a"
    fontsize: 1.02em
